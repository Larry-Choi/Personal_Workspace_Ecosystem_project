[package]
name = "asterism"
version = "0.1.0"
description = "Keyboard-first constellation launcher"
authors = ["Asterism"]
edition = "2021"

[lib]
name = "asterism_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
tauri = { version = "2.5.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5.3.0"
